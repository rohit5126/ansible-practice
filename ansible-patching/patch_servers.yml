---
- name: "patch weekend activity"
  hosts: all
  become: true
  gather_facts: true
  serial: 25%
  max_fail_percentage: 0

  vars:
    ssh_service: "{{ 'sshd' if ansible_facts.os_family == 'RedHat' else 'ssh' }}"
    disk_available: 20
    all_services: "{{ [ssh_service] + services }}"

  tasks:
  - name: pre-checks
    tags: [precheck]
    block:
      - name: verify ping on the server
        ping:

      - name: Check free disk space
        assert:
          that:
            - ((item.size_available | float / item.size_total) * 100) >= disk_available
          fail_msg: "{{ item.mount }} does not have enough space, currently only {{ ((item.size_available | float  / item.size_total) * 100) }}% available."
          quiet: true
        loop: "{{ ansible_facts.mounts | rejectattr('fstype', 'equalto', 'squashfs') | rejectattr('device', 'match', '^/dev/loop') | list }}"

      - name: check service status
        command: " systemctl is-active {{ item }}"
        loop: "{{ all_services }}"
        register: pre_service
        changed_when: false
        failed_when: false

      - name: show pre service result
        set_fact:
          service_result: "{{ dict(pre_service.results | map(attribute='item') | zip(pre_service.results | map(attribute='stdout'))) }}"

      - name: display result
        debug:
          var: service_result

      - name: abort if precheck failed
        assert:
          that: service_result.values() | select('ne' , 'active') | list | length == 0
          fail_msg: "pre check failed"
        when: abort_if_precheck_failed | bool

      - name: capture baseline
        shell: |
          set -o pipefail
          echo "KERNEL=$(uname -r)" 
          echo "Uptime=$(uptime -p)" 
          echo "Ports=$(ss -tulnp | awk '{print $5}' | sort -u )"
        args:
          executable: /bin/bash
        register: baseline_output
        changed_when: false

      - name: print baseline
        debug:
          var: baseline_output.stdout_lines


  - name: Patching
    tags: [patching]
    block:
      - name: apply updates RHEL family
        dnf:
          name: "*"
          state: latest
          update_cache: true
          lock_timeout: 300
        register: patch_result
        when: ansible_facts.os_family == "RedHat"

      - name: apply updates Debian family
        apt:
          update_cache: true
          lock_timeout: 300
        register: patch_result
        when: ansible_facts.os_family == "Debian"

      - name: reboot server
        reboot:
          reboot_timeout: 200
          post_reboot_delay: 30
        when: reboot_required | bool
    
    rescue:
      - name: patching failed
        fail:
          msg: "Patching failed on {{ inventory_hostname }} review output above"

  - name: Postchecks
    tags: [postcheck]
    block:
      - name: wait for host to be reachable
        ansible.builtin.wait_for_connection:
          timeout: 200
      - name: chech services
        command: systemctl is-active {{ item }}
        loop: "{{ all_services }}"
        register: post_service
        changed_when: false
        failed_when: false

      - name: set facts for post_service
        set_fact:
          post_result: "{{ dict(post_service.results | map(attribute='item') | zip(post_service.results | map(attribute='stdout'))) }}"
    
      - name: capture post reboot baseline
        shell: |
          set -o pipefail 
          echo "KERNEL = $(uname -r)"
          echo "UPTIME = $(uptime -p)"
          echo "PORTS = $(ss -tulnp | awk '{print $5}' | sort -u)"
        args:
          executable: /bin/bash
        register: baseline_post
        changed_when: false

      - name: application health check
        uri:
          url: "{{ health_check_url }}"
          status_code: [200,204]
          timeout: 10
        register: health
        until: health.status in [200,204]
        retries: "{{ service_retries }}"
        delay: "{{ service_delay }}"
        failed_when: false
      
      - name: Print post services
        debug:
          var: post_result
      
      - name: validate post services
        assert:
          that: post_result.values() | select('ne','active') | list | length == 0
          fail_msg: "post service cehck failed"
        when: abort_if_postcheck_failed | bool

      - name: prnt baseline_output
        debug:
         var: baseline_post.stdout_lines

      - name: validate application health
        assert: 
          that: health.status in [200,204]
          fail_msg: "application not reachable"

      - name: patching summary
        debug:
          msg: "Patching completed everything is up and running"
          var: "{{ health.status }}"
      
          
        
        





    


      



         


          

         


     